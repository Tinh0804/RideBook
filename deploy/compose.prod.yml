name: ridebook

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15.18-alpine}
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in the runtime environment}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in the runtime environment}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the runtime environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    shm_size: 128m
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - data

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - data

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable image digest in release.env}
    env_file:
      - ${RUNTIME_ENV_FILE:-/etc/ridebook/ridebook.env}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:?Set DB_NAME}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx896m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1400m
    cpus: 1.50
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:8080/RideBook/actuator/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - edge
      - data

  nginx:
    image: ${NGINX_IMAGE:-nginx:alpine}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${ACME_WEBROOT:-/var/www/ridebook-certbot}:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - edge

volumes:
  postgres-data:
  redis-data:

networks:
  edge:
  data:
    internal: true
