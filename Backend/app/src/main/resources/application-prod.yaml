server:
    forward-headers-strategy: framework

spring:
    flyway:
        enabled: true
        baseline-on-migrate: true
        baseline-version: 1
        validate-on-migrate: true
        locations: classpath:db/migration
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: false
        properties:
            hibernate:
                format_sql: false

springdoc:
    api-docs:
        enabled: false
    swagger-ui:
        enabled: false

management:
    endpoint:
        health:
            show-details: never
