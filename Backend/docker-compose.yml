name: ridebook

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ridebook}
      POSTGRES_USER: ${DB_USERNAME:-ridebook}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Backend/.env}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in Backend/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" &&
          psql -U "$${POSTGRES_USER}" -d postgres -tAc
          "SELECT 1 FROM pg_database WHERE datname='$${KEYCLOAK_DB_NAME}'" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  keycloak:
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    image: ridebook-keycloak:26.7.0
    command: start --optimized --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in Backend/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in Backend/.env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in Backend/.env}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8180}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_PROVISIONER_CLIENT_SECRET: ${KEYCLOAK_PROVISIONER_CLIENT_SECRET:?Set KEYCLOAK_PROVISIONER_CLIENT_SECRET in Backend/.env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      RIDEBOOK_DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-ridebook}
      RIDEBOOK_DB_USERNAME: ${DB_USERNAME:-ridebook}
      RIDEBOOK_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Backend/.env}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          { printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ridebook-backend:local
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-ridebook}
      DB_USERNAME: ${DB_USERNAME:-ridebook}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Backend/.env}
      REDIS_URL: redis://redis:6379
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:8080/RideBook/v3/api-docs
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
