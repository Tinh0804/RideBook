name: ridebook

services:
  keycloak:
    image: ${KEYCLOAK_IMAGE:?Set KEYCLOAK_IMAGE in the production environment}
    command: start --optimized --import-realm
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: ${KEYCLOAK_DB_URL:?Set KEYCLOAK_DB_URL}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:?Set KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?Set the public KEYCLOAK_HOSTNAME}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_PROVISIONER_CLIENT_SECRET: ${KEYCLOAK_PROVISIONER_CLIENT_SECRET:?Set KEYCLOAK_PROVISIONER_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      RIDEBOOK_DB_URL: ${RIDEBOOK_DB_URL:?Set the Backend read-only database URL}
      RIDEBOOK_DB_USERNAME: ${RIDEBOOK_DB_USERNAME:?Set the Backend read-only database username}
      RIDEBOOK_DB_PASSWORD: ${RIDEBOOK_DB_PASSWORD:?Set the Backend read-only database password}
    expose:
      - "8080"
      - "9000"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          { printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    networks:
      - shared-network

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in the production environment}
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    environment:
      DB_URL: ${DB_URL:?Set DB_URL}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:8080/RideBook/v3/api-docs
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks:
      - shared-network

networks:
  shared-network:
    name: ${DOCKER_NETWORK:-shared-network}
    external: true
