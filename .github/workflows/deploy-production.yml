name: Deploy Production

on:
  workflow_call:
    inputs:
      image_ref:
        description: Immutable Backend image reference
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_ref:
        description: Immutable Backend image reference (repository@sha256:digest)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ridebook-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate immutable image reference
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          if [[ ! "$IMAGE_REF" =~ ^[a-zA-Z0-9._:/-]+@sha256:[a-f0-9]{64}$ ]]; then
            echo "image_ref must use an immutable sha256 digest" >&2
            exit 1
          fi

      - name: Checkout deployment bundle
        uses: actions/checkout@v4

      - name: Execute SSH Deployment
        uses: ./.github/actions/ssh-deploy
        with:
          image_ref: ${{ inputs.image_ref }}
          vm_host: ${{ secrets.GCP_VM_IP || vars.GCP_VM_IP }}
          vm_user: ${{ secrets.GCP_VM_USER || vars.GCP_VM_USER || 'ubuntu' }}
          ssh_private_key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          github_sha: ${{ github.sha }}
