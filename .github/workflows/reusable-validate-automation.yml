name: Reusable Validate Automation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          find deploy/scripts deploy/tests -type f -name '*.sh' -print0 | xargs -0 shellcheck
