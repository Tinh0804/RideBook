name: Reusable Backend Lint and Test

on:
  workflow_call:
    inputs:
      stage:
        description: "The stage to run: lint | test | security"
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute:
    name: ${{ inputs.stage == 'lint' && 'Compile Check' || inputs.stage == 'test' && 'Unit Tests' || 'Security Scan' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        if: inputs.stage == 'lint' || inputs.stage == 'test'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven wrapper
        if: inputs.stage == 'lint' || inputs.stage == 'test'
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: ${{ runner.os }}-maven-wrapper-${{ hashFiles('Backend/.mvn/wrapper/maven-wrapper.properties') }}

      - name: Compile Check
        if: inputs.stage == 'lint'
        run: ./mvnw -B -ntp compile

      - name: Run Tests
        if: inputs.stage == 'test'
        run: ./mvnw -B -ntp test

      - name: Run Trivy fs scan
        if: inputs.stage == 'security'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'Backend/'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          vuln-type: 'library'
