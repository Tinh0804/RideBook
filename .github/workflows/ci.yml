name: CI Pipeline
run-name: ${{ github.actor }}

on:
  push:
    branches: ['main', 'develop', 'deploy']
  pull_request:
    branches: ['main', 'develop', 'deploy']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  automation:
    uses: ./.github/workflows/reusable-validate-automation.yml

  detect-changes:
    uses: ./.github/workflows/reusable-detect-changes.yml

  backend-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    uses: ./.github/workflows/reusable-lint-test-backend.yml
    with:
      stage: lint

  backend-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    uses: ./.github/workflows/reusable-lint-test-backend.yml
    with:
      stage: test

  backend-security:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    uses: ./.github/workflows/reusable-lint-test-backend.yml
    with:
      stage: security

  frontend-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    uses: ./.github/workflows/reusable-lint-frontend.yml

  deployment-contract:
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Validate deployment contracts
        run: bash deploy/tests/deployment-contract.sh
