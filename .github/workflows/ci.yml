name: CI Pipeline
run-name: ${{ github.actor }}

on:
  push:
    branches: ['main','master','test']
  pull_request:
    branches: ['main','master','test']

jobs:
  build-backend:
    name: Build & Test Backend (Spring Boot)
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    runs-on: ubuntu-latest 
    defaults:
      run: 
        working-directory: ./Backend
    
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4 

      - name: Setup Java 21
        uses: actions/setup-java@v4 
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend tests
        run: ./mvnw -B -ntp test

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3 

      - name: Validate production Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ridebook-backend:ci-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build & Test Frontend (React Vite)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    runs-on: ubuntu-latest 
    defaults:
      run:
        working-directory: ./WebAPP
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './WebAPP/package-lock.json'
      
      # Cache node_modules
      - name: Cache Node Modules
        uses: actions/cache@v3
        with:
          path: |
            ./WebAPP/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('./WebAPP/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Cache Vite build
      - name: Cache Vite build
        uses: actions/cache@v3
        with:
          path: ./WebAPP/dist
          key: ${{ runner.os }}-vite-${{ hashFiles('./WebAPP/src/**/*') }}-${{ hashFiles('./WebAPP/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Install dependencies
        run: npm ci 
      
      - name: Run tests (if code changed)
        run: |
          if [ -n "$(git diff --name-only HEAD^ HEAD | grep 'WebAPP/src')" ]; then
            npm test
          else
            echo "No frontend changes, skipping tests"
          fi
      
      - name: Build Frontend
        run: npm run build

      # Upload build artifact để CD dùng
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./WebAPP/dist
          retention-days: 1
