name: Release Backend

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the published image after production approval
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Test, build once, and publish
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image.outputs.ref }}
    defaults:
      run:
        working-directory: ./Backend
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deployment contracts
        working-directory: .
        run: bash deploy/tests/deployment-contract.sh

      - name: Ensure release revision belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run Backend tests
        run: ./mvnw -B -ntp test

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_NAMESPACE }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push immutable Backend image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKER_NAMESPACE }}/ridebook-backend:${{ github.sha }}
            ${{ vars.DOCKER_NAMESPACE }}/ridebook-backend:${{ github.ref_name }}
          cache-from: type=gha,scope=backend-release
          cache-to: type=gha,mode=max,scope=backend-release
          provenance: true
          sbom: true

      - name: Capture immutable image reference
        id: image
        env:
          IMAGE_REPOSITORY: ${{ vars.DOCKER_NAMESPACE }}/ridebook-backend
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy published image
    needs: build-and-publish
    if: github.event_name != 'workflow_dispatch' || inputs.deploy
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-production.yml
    with:
      image_ref: ${{ needs.build-and-publish.outputs.image_ref }}
    secrets: inherit
