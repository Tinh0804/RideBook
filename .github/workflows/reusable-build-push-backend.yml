name: Reusable Build and Push Backend

on:
  workflow_call:
    outputs:
      image_ref:
        description: "Immutable image digest reference"
        value: ${{ jobs.build.outputs.image_ref }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build, Push and Scan
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image.outputs.ref }}
    defaults:
      run:
        working-directory: ./Backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case repository name
        id: repository_name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=$REPO_LOWER" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.repository_name.outputs.repo }}/ridebook-backend:${{ github.sha }}
            ghcr.io/${{ steps.repository_name.outputs.repo }}/ridebook-backend:latest
          cache-from: type=gha,scope=backend-release
          cache-to: type=gha,mode=max,scope=backend-release
          provenance: true
          sbom: true

      - name: Capture immutable image reference
        id: image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ steps.repository_name.outputs.repo }}/ridebook-backend
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Run Trivy vulnerability scanner on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ steps.repository_name.outputs.repo }}/ridebook-backend@${{ steps.build.outputs.digest }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
