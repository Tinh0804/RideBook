<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BookCar - Đặt xe nhanh chóng, tiện lợi, an toàn" />
    <title>BookCar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var uiState = localStorage.getItem('bookcar_ui');
          if (uiState) {
            var parsed = JSON.parse(uiState);
            var theme = parsed && parsed.state ? parsed.state.theme : parsed.theme;
            if (theme === 'light') {
              document.documentElement.classList.remove('dark');
            } else {
              document.documentElement.classList.add('dark');
            }
          } else {
            // Mặc định dark mode cho RideBook
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="antialiased bg-surface-dark text-content-main">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
